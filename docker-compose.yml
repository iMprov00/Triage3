services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY in .env}
      REDIS_URL: redis://redis:6379/1
      CORS_ORIGINS: http://${PUBLIC_HOST:-192.168.1.184}:${STAGE1_PORT:-1001},http://${PUBLIC_HOST:-192.168.1.184}:${STAGE2_PORT:-1002}
      RAILS_ALLOWED_HOSTS: ${PUBLIC_HOST:-192.168.1.184},api,localhost,127.0.0.1
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - api_storage:/rails/storage
    depends_on:
      - redis

  stage1:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_STAGE2_APP_URL: http://${PUBLIC_HOST:-192.168.1.184}:${STAGE2_PORT:-1002}
    restart: unless-stopped
    ports:
      - "${STAGE1_PORT:-1001}:80"
    depends_on:
      - api

  stage2:
    build:
      context: .
      dockerfile: client-stage2/Dockerfile
      args:
        VITE_STAGE1_APP_URL: http://${PUBLIC_HOST:-192.168.1.184}:${STAGE1_PORT:-1001}
    restart: unless-stopped
    ports:
      - "${STAGE2_PORT:-1002}:80"
    depends_on:
      - api

volumes:
  api_storage:
  redis_data:
